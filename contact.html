<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <nav>
    <a class="logo" href="index.html">✦ Hello</a>
    <a class="link" href="index.html">Home</a>
    <a class="link" href="about.html">About</a>
    <a class="link" href="myportfolio.html">Portfolio</a>
    <a class="link active" href="contact.html">Contact</a>
  </nav>

  <div class="page">
    <main>
      <span class="badge"><span class="dot"></span> We reply within 24h</span>
      <h1 class="sm">Contact</h1>
      <p class="lead">Have a question or an idea? Drop us a message and we'll get back to you.</p>

      <form id="contact-form">
        <div class="row">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Jane Doe" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="jane@example.com" required />
          </div>
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell us what's on your mind..." required></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Send Message</button>
      </form>
      <div class="success" id="success">✅ Thanks! Your message has been received.</div>

      <div class="contact-info">
        <span>📍 Your City</span>
        <span>✉️ hello@example.com</span>
        <span>📞 +1 (555) 000-0000</span>
      </div>
      <footer>Made with ❤️ and modern CSS</footer>
    </main>
  </div>

  <script>
    // Demo only: no backend, so the form just shows a confirmation.
    document.getElementById("contact-form").addEventListener("submit", (e) => {
      e.preventDefault();
      e.target.reset();
      document.getElementById("success").classList.add("show");
    });
  </script>
</body>
</html>
