<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <nav>
    <a class="logo" href="index.html">✦ Hello</a>
    <a class="link active" href="index.html">Home</a>
    <a class="link" href="about.html">About</a>
    <a class="link" href="contact.html">Contact</a>
  </nav>

  <div class="page">
    <main>
      <span class="badge"><span class="dot"></span> Live &amp; running</span>
      <h1>Hello, World <span class="wave">👋</span></h1>
      <p class="lead">A simple start, beautifully crafted. Welcome to your fancy new page.</p>
      <div class="actions">
        <button class="btn btn-primary" id="greet">Say Hello</button>
        <a class="btn btn-ghost" href="about.html">Learn More</a>
      </div>
      <footer>Made with ❤️ and modern CSS</footer>
    </main>
  </div>

  <script>
    const greetings = ["Hello", "Hola", "Bonjour", "Ciao", "こんにちは", "Hallo", "Salaam", "Olá", "안녕하세요", "Namaste"];
    let i = 0;
    document.getElementById("greet").addEventListener("click", () => {
      i = (i + 1) % greetings.length;
      document.querySelector("h1").firstChild.textContent = greetings[i] + ", World ";
    });
  </script>
</body>
</html>
