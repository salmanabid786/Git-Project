<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07070d;
      --text: #f4f4f8;
      --muted: #a1a1b5;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.1);
      --c1: #7c3aed;
      --c2: #06b6d4;
      --c3: #f43f5e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated gradient blobs */
    .blob {
      position: fixed;
      width: 45vmax;
      height: 45vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      z-index: 0;
      animation: float 18s ease-in-out infinite;
    }
    .blob.one   { background: var(--c1); top: -15vmax; left: -10vmax; }
    .blob.two   { background: var(--c2); bottom: -15vmax; right: -10vmax; animation-delay: -6s; }
    .blob.three { background: var(--c3); top: 40%; left: 50%; width: 25vmax; height: 25vmax; opacity: 0.25; animation-delay: -12s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(6vw, 4vh) scale(1.1); }
      66%      { transform: translate(-4vw, 6vh) scale(0.95); }
    }

    /* Subtle grid overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
      opacity: 0.35;
      z-index: 1;
    }

    main {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 3.5rem 3rem;
      margin: 1rem;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      animation: rise 1s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      margin-bottom: 1.75rem;
    }
    .badge .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 50% { opacity: 0.4; } }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(3rem, 11vw, 6.5rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(120deg, #fff 0%, var(--c2) 35%, var(--c1) 65%, var(--c3) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }

    .wave {
      display: inline-block;
      -webkit-text-fill-color: initial;
      animation: wave 2.5s ease-in-out infinite;
      transform-origin: 70% 70%;
    }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0); }
      10%, 30% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      40% { transform: rotate(-4deg); }
      50% { transform: rotate(10deg); }
    }

    p.lead {
      margin: 1.5rem auto 2.5rem;
      max-width: 34ch;
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.9rem 1.8rem;
      font: 600 1rem "Inter", sans-serif;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .btn-primary {
      color: #fff;
      border: none;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(6, 182, 212, 0.45);
    }
    .btn-ghost {
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-3px);
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: var(--muted);
      opacity: 0.7;
    }

    @media (max-width: 480px) {
      main { padding: 2.5rem 1.5rem; }
      .btn { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <main>
    <span class="badge"><span class="dot"></span> Live &amp; running</span>
    <h1>Hello, World <span class="wave">👋</span></h1>
    <p class="lead">A simple start, beautifully crafted. Welcome to your fancy new page.</p>
    <div class="actions">
      <button class="btn btn-primary" id="greet">Say Hello</button>
      <a class="btn btn-ghost" href="#" onclick="return false;">Learn More</a>
    </div>
    <footer id="msg">Made with ❤️ and modern CSS</footer>
  </main>

  <script>
    const greetings = ["Hello", "Hola", "Bonjour", "Ciao", "こんにちは", "Hallo", "Salaam", "Olá", "안녕하세요", "Namaste"];
    let i = 0;
    document.getElementById("greet").addEventListener("click", () => {
      i = (i + 1) % greetings.length;
      document.querySelector("h1").firstChild.textContent = greetings[i] + ", World ";
    });
  </script>
</body>
</html>
